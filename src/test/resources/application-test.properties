# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9093
spring.kafka.topic-name=task-status-topic
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.example.demo.kafka.TaskDeserializer
spring.kafka.consumer.properties.fetch-max-wait=500
spring.kafka.consumer.properties.fetch-min-size=1
spring.kafka.consumer.properties.max-poll-records=50
spring.kafka.consumer.properties.max-partition-fetch-bytes=209715200
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max-request-size=209715200

